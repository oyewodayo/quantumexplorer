<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Quantum Explorer">
  <defs>
    <linearGradient id="qe-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0033a0"/>
      <stop offset="1" stop-color="#0053a0"/>
    </linearGradient>
    <radialGradient id="qe-sphere" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#qe-bg)"/>
  <!-- Bloch sphere -->
  <circle cx="32" cy="33" r="19" fill="url(#qe-sphere)" stroke="#fff" stroke-width="2"/>
  <ellipse cx="32" cy="33" rx="19" ry="6.5" fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="1.6"/>
  <ellipse cx="32" cy="33" rx="7" ry="19" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.4"/>
  <!-- state vector -->
  <line x1="32" y1="33" x2="43.5" y2="20.5" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="43.5" cy="20.5" r="3.4" fill="#fbbf24" stroke="#fff" stroke-width="1.2"/>
  <circle cx="32" cy="33" r="1.8" fill="#fff"/>
  <!-- orbiting particle -->
  <circle cx="13.2" cy="36" r="2.2" fill="#67e8f9"/>
</svg>
